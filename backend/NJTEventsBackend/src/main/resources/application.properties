# MySQL konekcija
spring.datasource.url= jdbc:mysql://localhost:3306/njtevents?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA i Hibernate podesavanja
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

# Port servera
server.port = 8081



# Email (Gmail SMTP) — kredencijali se NE čuvaju u repozitorijumu.
# Postaviti promenljive okruženja MAIL_USERNAME (Gmail adresa) i MAIL_PASSWORD (16-cifrena App Password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
